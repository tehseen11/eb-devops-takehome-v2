apiVersion: v1
kind: Service

metadata:
  name: {{ include "enterprisebot-service.fullname" . }}
  labels:
    app: {{ include "enterprisebot-service.name" . }}

spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "enterprisebot-service.name" . }}

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
